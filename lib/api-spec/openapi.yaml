openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Overtime Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: rosters
  - name: classifications
  - name: employees
  - name: events
  - name: reports

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Rosters ──────────────────────────────────────────────────────────────
  /rosters:
    get:
      operationId: listRosters
      tags: [rosters]
      summary: List all rosters
      responses:
        "200":
          description: List of rosters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Roster"
    post:
      operationId: createRoster
      tags: [rosters]
      summary: Create a roster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RosterInput"
      responses:
        "201":
          description: Created roster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Roster"

  /rosters/{id}:
    get:
      operationId: getRoster
      tags: [rosters]
      summary: Get a roster
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Roster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Roster"
        "404":
          description: Not found
    patch:
      operationId: updateRoster
      tags: [rosters]
      summary: Update a roster
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RosterInput"
      responses:
        "200":
          description: Updated roster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Roster"
        "404":
          description: Not found
    delete:
      operationId: deleteRoster
      tags: [rosters]
      summary: Delete a roster
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /rosters/{id}/settings:
    get:
      operationId: getRosterSettings
      tags: [rosters]
      summary: Get settings for a roster
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Roster settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterSettings"
        "404":
          description: Not found
    put:
      operationId: updateRosterSettings
      tags: [rosters]
      summary: Update settings for a roster
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RosterSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterSettings"
        "404":
          description: Not found

  /rosters/{id}/day-type-config:
    get:
      operationId: listDayTypeConfig
      tags: [rosters]
      summary: List day type configuration for a roster
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of day type configs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DayTypeConfig"
    post:
      operationId: createDayTypeConfig
      tags: [rosters]
      summary: Create a new day type config entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDayTypeConfigInput"
      responses:
        "201":
          description: Created day type config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayTypeConfig"

  /rosters/{id}/day-type-config/{dayType}:
    put:
      operationId: upsertDayTypeConfig
      tags: [rosters]
      summary: Upsert a day type config entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: dayType
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DayTypeConfigInput"
      responses:
        "200":
          description: Updated day type config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayTypeConfig"
    delete:
      operationId: deleteDayTypeConfig
      tags: [rosters]
      summary: Delete a day type config entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: dayType
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ── Roles ─────────────────────────────────────────────────────────────────
  /rosters/{rosterId}/roles:
    get:
      operationId: listRoles
      tags: [classifications]
      summary: List roles for a roster
      parameters:
        - name: rosterId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
    post:
      operationId: createRole
      tags: [classifications]
      summary: Create a role
      parameters:
        - name: rosterId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "201":
          description: Created role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"

  /rosters/{rosterId}/roles/{id}:
    patch:
      operationId: updateRole
      tags: [classifications]
      summary: Update a role
      parameters:
        - name: rosterId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "404":
          description: Not found
    delete:
      operationId: deleteRole
      tags: [classifications]
      summary: Delete a role
      parameters:
        - name: rosterId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Subclasses ────────────────────────────────────────────────────────────
  /rosters/{rosterId}/subclasses:
    get:
      operationId: listSubclasses
      tags: [classifications]
      summary: List subclasses for a roster
      parameters:
        - name: rosterId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of subclasses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subclass"
    post:
      operationId: createSubclass
      tags: [classifications]
      summary: Create a subclass
      parameters:
        - name: rosterId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubclassInput"
      responses:
        "201":
          description: Created subclass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subclass"

  /rosters/{rosterId}/subclasses/{id}:
    patch:
      operationId: updateSubclass
      tags: [classifications]
      summary: Update a subclass
      parameters:
        - name: rosterId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubclassInput"
      responses:
        "200":
          description: Updated subclass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subclass"
        "404":
          description: Not found
    delete:
      operationId: deleteSubclass
      tags: [classifications]
      summary: Delete a subclass
      parameters:
        - name: rosterId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Employees ─────────────────────────────────────────────────────────────
  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List employees, optionally filtered by roster
      parameters:
        - name: rosterId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create a new employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get employee by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found
    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Delete an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /employees/{id}/report:
    get:
      operationId: getEmployeeReport
      tags: [reports]
      summary: Get overtime history for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Employee report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeReport"
        "404":
          description: Not found

  # ── Events ────────────────────────────────────────────────────────────────
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List events, optionally filtered by roster
      parameters:
        - name: rosterId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [events]
      summary: Submit a new overtime event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get a single event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Not found
    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Not found
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Reports ───────────────────────────────────────────────────────────────
  /up-next:
    get:
      operationId: getUpNext
      tags: [reports]
      summary: Get ordered overtime rotation for a roster
      parameters:
        - name: rosterId
          in: query
          required: true
          schema:
            type: integer
        - name: dayType
          in: query
          required: false
          schema:
            type: string
            default: weekday
      responses:
        "200":
          description: Ordered rotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpNextResult"

  /stats:
    get:
      operationId: getStats
      tags: [reports]
      summary: Get summary statistics
      parameters:
        - name: rosterId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

  /suggest-day-type:
    get:
      operationId: suggestDayType
      tags: [reports]
      summary: Suggest a day type for a given date
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Suggested day type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayTypeSuggestion"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Rosters ──────────────────────────────────────────────────────────────
    Roster:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]

    RosterInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]

    RosterSettings:
      type: object
      required: [rosterId, useOfferedHours, useSeniority, useSubclassOrdering]
      properties:
        rosterId:
          type: integer
        useOfferedHours:
          type: boolean
        useSeniority:
          type: boolean
        useSubclassOrdering:
          type: boolean

    RosterSettingsInput:
      type: object
      properties:
        useOfferedHours:
          type: boolean
        useSeniority:
          type: boolean
        useSubclassOrdering:
          type: boolean

    DayTypeConfig:
      type: object
      required: [rosterId, dayType, name, enabled, sortOrder]
      properties:
        rosterId:
          type: integer
        dayType:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        multiplier:
          type: ["number", "null"]
        sortOrder:
          type: integer
          default: 0

    DayTypeConfigInput:
      type: object
      properties:
        name:
          type: string
        enabled:
          type: boolean
        multiplier:
          type: ["number", "null"]
        sortOrder:
          type: integer

    CreateDayTypeConfigInput:
      type: object
      required: [dayType, name]
      properties:
        dayType:
          type: string
        name:
          type: string
        enabled:
          type: boolean
          default: true
        multiplier:
          type: ["number", "null"]
        sortOrder:
          type: integer
          default: 0

    # ── Classifications ───────────────────────────────────────────────────────
    Role:
      type: object
      required: [id, rosterId, name]
      properties:
        id:
          type: integer
        rosterId:
          type: integer
        name:
          type: string

    RoleInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    Subclass:
      type: object
      required: [id, rosterId, name, sortOrder]
      properties:
        id:
          type: integer
        rosterId:
          type: integer
        name:
          type: string
        sortOrder:
          type: integer
          description: Lower value = higher priority in Up Next ordering

    SubclassInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        sortOrder:
          type: integer

    # ── Employees ─────────────────────────────────────────────────────────────
    Employee:
      type: object
      required: [id, rosterId, name, seniority, active]
      properties:
        id:
          type: integer
        rosterId:
          type: integer
        name:
          type: string
        seniority:
          type: integer
        roleId:
          type: ["integer", "null"]
        roleName:
          type: ["string", "null"]
        subclassId:
          type: ["integer", "null"]
        subclassName:
          type: ["string", "null"]
        active:
          type: boolean
        totalOfferedHours:
          type: number
        totalWorkedHours:
          type: number
        fairnessScore:
          type: number
          description: Weighted offered hours used for rotation ordering

    EmployeeInput:
      type: object
      required: [rosterId, name, seniority]
      properties:
        rosterId:
          type: integer
        name:
          type: string
          minLength: 1
        seniority:
          type: integer
          minimum: 1
        roleId:
          type: ["integer", "null"]
        subclassId:
          type: ["integer", "null"]
        active:
          type: boolean
          default: true

    EmployeeUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        seniority:
          type: integer
          minimum: 1
        roleId:
          type: ["integer", "null"]
        subclassId:
          type: ["integer", "null"]
        active:
          type: boolean

    # ── Events ────────────────────────────────────────────────────────────────
    Event:
      type: object
      required: [id, rosterId, date, description, defaultHours, dayType, multiplier, entries]
      properties:
        id:
          type: integer
        rosterId:
          type: integer
        date:
          type: string
          format: date
        description:
          type: string
        defaultHours:
          type: number
        dayType:
          type: string
        multiplier:
          type: number
          default: 1
        entries:
          type: array
          items:
            $ref: "#/components/schemas/EventEntry"

    EventEntry:
      type: object
      required: [id, employeeId, employeeName, offered, worked, hoursOffered, hoursAwarded]
      properties:
        id:
          type: integer
        employeeId:
          type: integer
        employeeName:
          type: string
        offered:
          type: boolean
        worked:
          type: boolean
        hoursOverride:
          type: ["number", "null"]
        hoursAwarded:
          type: number
        hoursOffered:
          type: number

    EventInput:
      type: object
      required: [rosterId, date, description, defaultHours, dayType, entries]
      properties:
        rosterId:
          type: integer
        date:
          type: string
          format: date
        description:
          type: string
          minLength: 1
        defaultHours:
          type: number
          minimum: 0
        dayType:
          type: string
        multiplier:
          type: number
          minimum: 0
          default: 1
        entries:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/EventEntryInput"

    EventEntryInput:
      type: object
      required: [employeeId, offered, worked]
      properties:
        employeeId:
          type: integer
        offered:
          type: boolean
        worked:
          type: boolean
        hoursOverride:
          type: ["number", "null"]

    # ── Reports ───────────────────────────────────────────────────────────────
    UpNextResult:
      type: object
      required: [rosterId, dayType, employees]
      properties:
        rosterId:
          type: integer
        dayType:
          type: string
        employees:
          type: array
          items:
            $ref: "#/components/schemas/UpNextEmployee"

    UpNextEmployee:
      type: object
      required: [id, name, seniority, totalOfferedHours, fairnessScore, rank]
      properties:
        id:
          type: integer
        name:
          type: string
        subclassId:
          type: ["integer", "null"]
        subclassName:
          type: ["string", "null"]
        roleName:
          type: ["string", "null"]
        seniority:
          type: integer
        totalOfferedHours:
          type: number
        fairnessScore:
          type: number
        rank:
          type: integer

    EmployeeReport:
      type: object
      required: [employee, totalOfferedHours, totalWorkedHours, events]
      properties:
        employee:
          $ref: "#/components/schemas/Employee"
        totalOfferedHours:
          type: number
        totalWorkedHours:
          type: number
        acceptanceRate:
          type: number
        events:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeEventRecord"

    EmployeeEventRecord:
      type: object
      required: [eventId, date, description, dayType, offered, worked, hoursOffered, hoursAwarded, multiplier]
      properties:
        eventId:
          type: integer
        date:
          type: string
          format: date
        description:
          type: string
        dayType:
          type: string
        offered:
          type: boolean
        worked:
          type: boolean
        hoursOffered:
          type: number
        hoursAwarded:
          type: number
        hoursOverride:
          type: ["number", "null"]
        multiplier:
          type: number
          default: 1

    Stats:
      type: object
      required: [totalEvents, totalOfferedHours, totalWorkedHours, employeeCount]
      properties:
        totalEvents:
          type: integer
        totalOfferedHours:
          type: number
        totalWorkedHours:
          type: number
        employeeCount:
          type: integer
        topWorkers:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeStat"
        recentEvents:
          type: array
          items:
            $ref: "#/components/schemas/Event"

    EmployeeStat:
      type: object
      required: [id, name, totalWorkedHours, totalOfferedHours]
      properties:
        id:
          type: integer
        name:
          type: string
        totalWorkedHours:
          type: number
        totalOfferedHours:
          type: number

    DayTypeSuggestion:
      type: object
      required: [date, suggestedDayType, reason]
      properties:
        date:
          type: string
          format: date
        suggestedDayType:
          type: string
          enum: [weekday, weekend, holiday]
        reason:
          type: string
        isHoliday:
          type: boolean
        holidayName:
          type: ["string", "null"]
